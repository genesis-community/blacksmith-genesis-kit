---
params:
  google_project: (( param "Enter the project name that your BOSH will be deployed into" ))

  ntp: # use GCP ntp
    - (( replace ))
    - time.google.com
    - time2.google.com
    - time3.google.com
    - time4.google.com

  stemcells:
    - name:    bosh-google-kvm-ubuntu-jammy-go_agent
      version: '1.1517'
      url:     https://storage.googleapis.com/bosh-gce-light-stemcells/1.1517/light-bosh-stemcell-1.1517-google-kvm-ubuntu-jammy-go_agent.tgz
      sha1:    3071eea8a422bf203177ae15ef24da52d48a2db0

releases:
  - name:    bosh-google-cpi
    version: "49.0.1"
    url:     https://bosh.io/d/github.com/cloudfoundry/bosh-google-cpi-release?v=49.0.1
    sha1:    0be6fd82fb5d6121105733a3e9ae33e62e4b0a8b

instance_groups:
- name: blacksmith
  jobs:
  - name: google_cpi
    release: bosh-google-cpi
  properties:
    google:
      project: (( grab params.google_project ))
      json_key: (( vault meta.vault "/google:json_key" ))
    director:
      cpi_job: google_cpi
