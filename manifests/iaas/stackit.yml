---
params:
  stackit_auth_url: (( param "What is the STACKIT Auth URL?" ))
  stackit_username: (( vault meta.vault "/stackit/creds:username" ))
  stackit_password: (( vault meta.vault "/stackit/creds:password" ))
  stackit_domain:   (( vault meta.vault "/stackit/creds:domain" ))
  stackit_project:  (( vault meta.vault "/stackit/creds:project" ))
  stackit_region:   (( param "What is the STACKIT Region?" ))
  stackit_ssh_key:  (( param "What is the STACKIT SSH Key Name?" ))
  stackit_default_security_groups: (( param "What STACKIT SGs are applied to VMs by default?" ))

  stemcells:
  - name:    bosh-openstack-kvm-ubuntu-jammy-go_agent
    version: '1.181'
    url:     https://storage.googleapis.com/bosh-core-stemcells/1.181/bosh-stemcell-1.181-openstack-kvm-ubuntu-jammy-go_agent.tgz
    sha1:    dcf3f905c617c38ba3c6a2d661ec41d8651e75f4

releases:
- name:    bosh-openstack-cpi
  version: 53
  url:     https://bosh.io/d/github.com/cloudfoundry/bosh-openstack-cpi-release?v=53
  sha1:    c9402008495b6c13c22eed9b45a8ce21ac2e274a

instance_groups:
- name: blacksmith
  jobs:
  - name: openstack_cpi
    release: bosh-openstack-cpi
  properties:
    director:
      cpi_job: openstack_cpi

    openstack:
      auth_url: (( grab params.stackit_auth_url ))
      username: (( grab params.stackit_username ))
      api_key: (( grab params.stackit_password ))
      domain: (( grab params.stackit_domain ))
      project: (( grab params.stackit_project ))
      region: (( grab params.stackit_region ))
      default_key_name: (( grab params.stackit_ssh_key ))
      default_security_groups: (( grab params.stackit_default_security_groups ))
      human_readable_vm_names: true