---
meta:
  environment: (( grab genesis.env || params.env ))
  bosh_env: (( grab genesis.bosh_env || params.bosh_env || params.env ))

  # The valkey-forge plan template renders `version: <%= p('stemcell_version') %>`
  # (bare ERB), so a numeric-looking pin such as 1.460 gets YAML
  # float-normalised to 1.46 when the broker re-merges the plan and BOSH
  # then can't find the stemcell. Pre-quoting the value here makes the
  # emitted scalar a quoted string end-to-end.
  stemcell_version_pin: (( grab params.stemcell_version || "latest" ))

  default:
    valkey_tags:
    - blacksmith
    - dedicated
    - valkey
    - redis

    valkey_plans:
      standalone:
        name: standalone
        description: A dedicated Valkey server, with no redundancy or replication
        limit: 7
        type: standalone
        version: 8
        vm_type: default
      cluster:
        name: cluster
        description: A Valkey cluster with 3 master nodes and 3 replica nodes
        limit: 5
        type: cluster
        version: 8
        vm_type: default
        masters: 3
        replicas: 1

releases:
 - name: valkey-forge
   version: 1.3.0
   url: https://github.com/blacksmith-community/valkey-forge-boshrelease/releases/download/v1.3.0/valkey-forge-1.3.0.tgz
   sha1: sha256:8f2cde1e6ef081dff160074b0cafe96672b49c28481b7f1a8c96a9f14dba3349

params:
  releases:
  - (( append ))
  - (( grab releases.valkey-forge ))

instance_groups:
- name: blacksmith
  jobs:
  - release: valkey-forge
    name:    valkey-blacksmith-plans
    properties:
      environment: (( grab meta.environment ))
      bosh_env: (( grab meta.bosh_env ))

      stemcell_os:      (( grab params.stemcell_os      || "ubuntu-noble" ))
      stemcell_version: (( concat "\"" meta.stemcell_version_pin "\"" ))

      plans: (( grab params.valkey_plans || meta.default.valkey_plans ))
      service:
        id:          (( grab params.valkey_service_id          || "valkey" ))
        name:        (( grab params.valkey_service_name        || params.valkey_service_id || "valkey" ))
        description: (( grab params.valkey_service_description || "A dedicated Valkey instance, deployed on-demand" ))
        tags:        (( grab params.valkey_service_tags        || meta.default.valkey_tags ))
        limit:       (( grab params.valkey_service_limit       || 0 ))
        type:        (( grab params.valkey_service_type        || "standalone" ))
