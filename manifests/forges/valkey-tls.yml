---
instance_groups:
- name: blacksmith
  jobs:
  - release: valkey-forge
    name:    valkey-blacksmith-plans
    properties:
      valkey:
        tls:
          enabled: true
          ca:      (( vault meta.vault "/tls/ca:combined" ))
          ca_cert: (( vault meta.vault "/tls/ca:certificate" ))
          ca_key:  (( vault meta.vault "/tls/ca:key" ))
