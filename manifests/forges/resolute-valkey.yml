---
# Valkey forge for ubuntu-resolute.
#
# The valkey-forge release pinned in forges/valkey.yml calls chpst, which
# resolute does not ship.  Valkey-forge 1.3.4 drops it, and 1.3.4 also
# defaults its bpm release to 1.4.41, which compiles on resolute.  The
# blueprint hook loads this file when the resolute and valkey features are both
# on, and spruce merges the entry over the pin by name.

releases:
- name:    valkey-forge
  version: 1.3.4
  url:     https://github.com/blacksmith-community/valkey-forge-boshrelease/releases/download/v1.3.4/valkey-forge-1.3.4.tgz
  sha1:    5d79766b5ac4d1c65814a133c9dabe5f08085ffa
