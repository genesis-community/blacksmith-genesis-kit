---
meta:
  environment: (( grab genesis.env || params.env ))
  bosh_env: (( grab genesis.bosh_env || params.bosh_env || params.env ))

  default:
    redis_tags:
    - blacksmith
    - dedicated
    - redis

    redis_plans:
      standalone:
        name: standalone
        description: A dedicated Redis server, with no redundancy or replication
        limit: 7
        type: standalone
        vm_type: default
      standalone-6:
        name: standalone-6
        description: A dedicated Redis 6 server, with no redundancy or replication
        limit: 7
        type: standalone-6
        vm_type: default
      standalone-7:
        name: standalone-7
        description: A dedicated Redis 7 server, with no redundancy or replication
        limit: 7
        type: standalone-7
        vm_type: default

releases:
- name: redis-forge
  version: 1.5.0
  url: https://github.com/blacksmith-community/redis-forge-boshrelease/releases/download/v1.5.0/redis-forge-1.5.0.tgz
  sha1: sha256:7b6a69d4f09c21f5746ad379a546ff0ad332d5fecf2135b4fc4f78adfdaf933f

params:
  releases:
  - (( append ))
  - (( grab releases.redis-forge ))

instance_groups:
- name: blacksmith
  jobs:
  - release: redis-forge
    name:    redis-blacksmith-plans
    properties:
      environment: (( grab meta.environment ))
      bosh_env: (( grab meta.bosh_env ))

      # The forge deploys its service instances on the broker's stemcell.
      # The version keeps the older redis_stemcell_version parameter ahead
      # of the broker's own.
      stemcell_os:      (( grab params.stemcell_os || "ubuntu-noble" ))
      stemcell_version: (( grab params.redis_stemcell_version || params.stemcell_version || "latest" ))

      plans: (( grab params.redis_plans || meta.default.redis_plans ))
      service:
        id:          (( grab params.redis_service_id          || "redis" ))
        name:        (( grab params.redis_service_name        || params.redis_service_id || "redis" ))
        description: (( grab params.redis_service_description || "A dedicated Redis instance, deployed on-demand" ))
        tags:        (( grab params.redis_service_tags        || meta.default.redis_tags ))
        limit:       (( grab params.redis_service_limit       || 0 ))
        type:        (( grab params.redis_service_type        || "standalone" ))
        stemcell:    (( grab params.redis_stemcell_version    || "latest" ))
