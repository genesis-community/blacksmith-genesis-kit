---
meta:
  environment: (( grab genesis.env || params.env ))
  bosh_env: (( grab genesis.bosh_env || params.bosh_env || params.env ))

  # The redis-forge plan template renders `version: <%= p('service.stemcell') %>`
  # (bare ERB), so a numeric-looking pin such as 1.460 gets YAML
  # float-normalised to 1.46 when the broker re-merges the plan and BOSH
  # then can't find the stemcell. Pre-quoting the value here makes the
  # emitted scalar a quoted string end-to-end.
  redis_stemcell_version_pin: (( grab params.redis_stemcell_version || "latest" ))

  default:
    redis_tags:
    - blacksmith
    - dedicated
    - redis

    redis_plans:
      standalone:
        name: standalone
        description: A dedicated Redis server, with no redundancy or replication
        limit: 7
        type: standalone
        vm_type: default
      standalone-6:
        name: standalone-6
        description: A dedicated Redis 6 server, with no redundancy or replication
        limit: 7
        type: standalone-6
        vm_type: default
      standalone-7:
        name: standalone-7
        description: A dedicated Redis 7 server, with no redundancy or replication
        limit: 7
        type: standalone-7
        vm_type: default

releases:
- name: redis-forge
  version: 1.4.2
  url: https://github.com/blacksmith-community/redis-forge-boshrelease/releases/download/v1.4.2/redis-forge-1.4.2.tgz
  sha1: sha256:5005dd6499f27e999e2716a3bd2a3147a127e425d1ec48b8a3a2eb3adbfc4948

params:
  releases:
  - (( append ))
  - (( grab releases.redis-forge ))

instance_groups:
- name: blacksmith
  jobs:
  - release: redis-forge
    name:    redis-blacksmith-plans
    properties:
      environment: (( grab meta.environment ))
      bosh_env: (( grab meta.bosh_env ))

      plans: (( grab params.redis_plans || meta.default.redis_plans ))
      service:
        id:          (( grab params.redis_service_id          || "redis" ))
        name:        (( grab params.redis_service_name        || params.redis_service_id || "redis" ))
        description: (( grab params.redis_service_description || "A dedicated Redis instance, deployed on-demand" ))
        tags:        (( grab params.redis_service_tags        || meta.default.redis_tags ))
        limit:       (( grab params.redis_service_limit       || 0 ))
        type:        (( grab params.redis_service_type        || "standalone" ))
        stemcell:    (( concat "\"" meta.redis_stemcell_version_pin "\"" ))
