---
meta:
  environment: (( grab genesis.env || params.env ))
  bosh_env: (( grab genesis.bosh_env || params.bosh_env || params.env ))

  # The rabbitmq-forge plan template renders `version: <%= p('service.stemcell') %>`
  # (bare ERB), so a numeric-looking pin such as 1.460 gets YAML
  # float-normalised to 1.46 when the broker re-merges the plan and BOSH
  # then can't find the stemcell. Pre-quoting the value here makes the
  # emitted scalar a quoted string end-to-end.
  rabbitmq_stemcell_version_pin: (( grab params.rabbitmq_stemcell_version || "latest" ))

  default:
    rabbitmq_tags:
    - blacksmith
    - dedicated
    - rabbitmq

    rabbitmq_plans:
      standalone:
        name: standalone
        description: A dedicated RabbitMQ server, with no redundancy or replication
        limit: 7
        type: standalone
        vm_type: default

releases:
- name: rabbitmq-forge
  version: 1.5.0
  url: https://github.com/blacksmith-community/rabbitmq-forge-boshrelease/releases/download/v1.5.0/rabbitmq-forge-1.5.0.tgz
  sha1: sha256:f5422675143847fa98a5a5f91dc1fddb058368d702179d74c62b5a4e28149d41

params:
  releases:
  - (( append ))
  - (( grab releases.rabbitmq-forge ))

instance_groups:
- name: blacksmith
  jobs:
  - release: rabbitmq-forge
    name:    rabbitmq-blacksmith-plans
    properties:
      environment: (( grab meta.environment ))
      bosh_env: (( grab meta.bosh_env ))
      plans: (( grab params.rabbitmq_plans || meta.default.rabbitmq_plans ))
      plugins: (( grab params.rabbitmq_plugins || ~ ))
      cf:
        nats_tls_only: (( grab params.cf.nats_tls_only || true ))
      service:
        id:          (( grab params.rabbitmq_service_id          || "rabbitmq" ))
        name:        (( grab params.rabbitmq_service_name        || params.rabbitmq_service_id || "rabbitmq" ))
        description: (( grab params.rabbitmq_service_description || "A dedicated RabbitMQ instance, deployed on-demand" ))
        tags:        (( grab params.rabbitmq_service_tags        || meta.default.rabbitmq_tags ))
        limit:       (( grab params.rabbitmq_service_limit       || 0 ))
        stemcell:    (( concat "\"" meta.rabbitmq_stemcell_version_pin "\"" ))
