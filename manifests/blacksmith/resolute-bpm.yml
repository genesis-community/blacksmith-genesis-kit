---
# bpm release for ubuntu-resolute.
#
# bpm releases before 1.4.41 bundle a tini package that fails to compile on
# resolute.  Spruce merges this entry over the pin in releases/blacksmith.yml
# by name, and the url there is built from the version, so the url and sha1
# are set here to match.

releases:
- name:    bpm
  version: 1.4.41
  url:     https://bosh.io/d/github.com/cloudfoundry/bpm-release?v=1.4.41
  sha1:    sha256:7b445508d63d2171d892ba33f836087e1e519b9782f44c5fa5290323616ca8e6
