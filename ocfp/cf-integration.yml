---
# The broker's connection to the CF API. The CA defaults to empty, which is
# right when haproxy presents a publicly trusted certificate. Set
# params.cf_cacert to a PEM bundle for a private CA, or enable the
# cf-haproxy-ca feature to reference the cf kit's self-signed haproxy CA.
instance_groups:
  - name: blacksmith
    jobs:
    - name: blacksmith
      properties:
        broker:
          cf:
            apis:
              ocf:
                name: (( concat genesis.env "-cf" ))
                endpoint: (( vault meta.cf.exodus_path ":api_domain" ))
                username: (( vault meta.cf.exodus_path ":admin_username" ))
                password: (( vault meta.cf.exodus_path ":admin_password" ))
                ca_cert:  (( grab params.cf_cacert || "" ))
                skip_ssl_validation: (( grab params.cf_skip_ssl_validation || false ))
