---
instance_groups:
  - name: blacksmith
    jobs:
    - name: blacksmith
      properties:
        broker:
          cf:
            apis:
              ocf:
                name: (( concat genesis.env "-cf" ))
                endpoint: (( vault meta.cf.exodus "api_domain" ))
                username: (( vault meta.cf.exodus ":admin_username" ))
                password: (( vault meta.cf.exodus ":admin_password" ))

