        port: 80
        tls:
          certificate: <!{meta.vault}/broker/server:certificate!>
          enabled: true
          key: <!{meta.vault}/broker/server:key!>
          port: 443
        username: blacksmith
      credhub:
        cleanup:
          enabled: false
      debug: false
      env: resoluteagent
      shareable: false
    release: blacksmith
  - name: redis-blacksmith-plans
    properties:
      bosh_env: resoluteagent
      environment: resoluteagent
      plans:
        standalone:
          description: A dedicated Redis server, with no redundancy or replication
          limit: 7
          name: standalone
          type: standalone
          vm_type: default
        standalone-6:
          description: A dedicated Redis 6 server, with no redundancy or replication
          limit: 7
          name: standalone-6
          type: standalone-6
          vm_type: default
        standalone-7:
          description: A dedicated Redis 7 server, with no redundancy or replication
          limit: 7
          name: standalone-7
          type: standalone-7
          vm_type: default
      service:
        description: A dedicated Redis instance, deployed on-demand
        id: redis
        limit: 0
        name: redis
        stemcell: latest
        tags:
        - blacksmith
        - dedicated
        - redis
        type: standalone
    release: redis-forge
  - name: shield-agent
    properties:
      agent:
        key: test-shield-pubkey
      core:
        ca: test-shield-ca
      env:
        http_proxy: ""
        https_proxy: ""
        no_proxy: ""
      require-shield-core: false
      shield-url: https://10.0.0.30
    release: shield
  - name: bpm
    release: bpm
  - name: nats
    release: bosh
  - name: postgres-9.4
    release: bosh
  - name: blobstore
    release: bosh
  - name: director
    release: bosh
  - name: health_monitor
    release: bosh
  - name: aws_cpi
    release: bosh-aws-cpi
  - name: registry
    release: bosh
