azs:
- name: z1
  cloud_properties:
    availability_zone: test-z1
vm_types:
- name: default
  cloud_properties:
    instance_type: m5.large
    ephemeral_disk: {size: 25_000}
- name: small
  cloud_properties:
    instance_type: m5.large
    ephemeral_disk: {size: 25_000}
disk_types:
- name: default
  disk_size: 3000
networks:
- name: default
  type: manual
  subnets:
  - range:   10.0.0.0/24
    gateway: 10.0.0.1
    azs:     [z1]
    dns:     [8.8.8.8]
    cloud_properties:
      subnet: subnet-test
compilation:
  workers: 5
  reuse_compilation_vms: true
  az: z1
  vm_type: default
  network: default
